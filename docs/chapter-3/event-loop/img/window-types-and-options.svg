<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
  <title id="title">Window styles, backgrounds, and flags</title>
  <desc id="description">Three window frame styles, four semantic backgrounds, and the controls changed by window flags.</desc>
  <rect width="1200" height="820" rx="18" fill="#f4f6fb"/>
  <text x="40" y="52" fill="#182238" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Choose a window appearance</text>
  <text x="40" y="82" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="17">Type selects the frame; Background selects the semantic color scheme.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(35 110)">
      <rect width="355" height="230" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="28" y="26" width="299" height="106" fill="#11245d" stroke="#3046b5" stroke-width="5"/>
      <rect x="35" y="33" width="285" height="92" fill="none" stroke="#dbeafe" stroke-width="2"/>
      <rect x="46" y="18" width="263" height="22" fill="#f4f6fb"/>
      <text x="177" y="35" text-anchor="middle" fill="#182238" font-size="17" font-weight="700">Classic window</text>
      <text x="300" y="35" text-anchor="middle" fill="#b91c1c" font-size="18" font-weight="700">×</text>
      <text x="177" y="89" text-anchor="middle" fill="#fff" font-size="16">Square-corner frame</text>
      <text x="25" y="169" fill="#182238" font-size="20" font-weight="700">Classic</text>
      <text x="25" y="195" fill="#475569" font-size="16">Standard frame for dialogs and forms.</text>
      <text x="25" y="218" fill="#64748b" font-size="14">Type::Classic</text>
    </g>

    <g transform="translate(422 110)">
      <rect width="355" height="230" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="28" y="26" width="299" height="106" rx="20" fill="#11245d" stroke="#60a5fa" stroke-width="5"/>
      <rect x="46" y="18" width="263" height="22" fill="#f4f6fb"/>
      <text x="177" y="35" text-anchor="middle" fill="#182238" font-size="17" font-weight="700">Rounded window</text>
      <text x="300" y="35" text-anchor="middle" fill="#b91c1c" font-size="18" font-weight="700">×</text>
      <text x="177" y="89" text-anchor="middle" fill="#fff" font-size="16">Rounded-corner frame</text>
      <text x="25" y="169" fill="#182238" font-size="20" font-weight="700">Rounded</text>
      <text x="25" y="195" fill="#475569" font-size="16">Softer frame for confirmations and notices.</text>
      <text x="25" y="218" fill="#64748b" font-size="14">Type::Rounded</text>
    </g>

    <g transform="translate(809 110)">
      <rect width="355" height="230" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="28" y="26" width="299" height="106" fill="#11245d"/>
      <rect x="28" y="26" width="299" height="24" fill="#3046b5"/>
      <text x="44" y="44" fill="#fff" font-size="15" font-weight="700">Panel window</text>
      <text x="311" y="44" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">×</text>
      <text x="177" y="92" text-anchor="middle" fill="#fff" font-size="16">Title bar, no frame</text>
      <text x="25" y="169" fill="#182238" font-size="20" font-weight="700">Panel</text>
      <text x="25" y="195" fill="#475569" font-size="16">Borderless chrome for compact content.</text>
      <text x="25" y="218" fill="#64748b" font-size="14">Type::Panel</text>
    </g>

    <text x="40" y="390" fill="#182238" font-size="22" font-weight="700">Background communicates purpose</text>
    <text x="40" y="417" fill="#475569" font-size="16">The active theme supplies the colors; these names express the message.</text>
    <g transform="translate(40 438)">
      <rect width="268" height="76" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="12" y="12" width="12" height="52" rx="6" fill="#64748b"/>
      <text x="38" y="34" fill="#182238" font-size="17" font-weight="700">Normal</text>
      <text x="38" y="57" fill="#475569" font-size="15">Theme default</text>
    </g>
    <g transform="translate(326 438)">
      <rect width="268" height="76" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="12" y="12" width="12" height="52" rx="6" fill="#dc2626"/>
      <text x="38" y="34" fill="#182238" font-size="17" font-weight="700">Error</text>
      <text x="38" y="57" fill="#475569" font-size="15">A failure needs attention</text>
    </g>
    <g transform="translate(612 438)">
      <rect width="268" height="76" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="12" y="12" width="12" height="52" rx="6" fill="#d89b13"/>
      <text x="38" y="34" fill="#182238" font-size="17" font-weight="700">Warning</text>
      <text x="38" y="57" fill="#475569" font-size="15">A caution or risk</text>
    </g>
    <g transform="translate(898 438)">
      <rect width="262" height="76" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="12" y="12" width="12" height="52" rx="6" fill="#2563eb"/>
      <text x="38" y="34" fill="#182238" font-size="17" font-weight="700">Notification</text>
      <text x="38" y="57" fill="#475569" font-size="15">Informational update</text>
    </g>

    <text x="40" y="568" fill="#182238" font-size="22" font-weight="700">Flags change controls and movement</text>
    <g transform="translate(40 590)">
      <rect width="268" height="178" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="18" y="32" fill="#182238" font-size="17" font-weight="700">Flags::None</text>
      <text x="18" y="62" fill="#475569" font-size="15">Close button visible</text>
      <text x="18" y="87" fill="#475569" font-size="15">Fixed size; can be moved</text>
      <text x="18" y="139" fill="#64748b" font-size="14">Default behavior</text>
    </g>
    <g transform="translate(326 590)">
      <rect width="268" height="178" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="18" y="32" fill="#182238" font-size="17" font-weight="700">Flags::Sizeable</text>
      <text x="18" y="62" fill="#475569" font-size="15">Adds resize grip</text>
      <text x="18" y="87" fill="#475569" font-size="15">Adds maximize/restore button</text>
      <text x="18" y="139" fill="#64748b" font-size="14">Can be combined with other flags</text>
    </g>
    <g transform="translate(612 590)">
      <rect width="268" height="178" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="18" y="32" fill="#182238" font-size="17" font-weight="700">NoCloseButton</text>
      <text x="18" y="62" fill="#475569" font-size="15">Hides the title-bar close button</text>
      <text x="18" y="139" fill="#64748b" font-size="14">Title-bar close is hidden</text>
    </g>
    <g transform="translate(898 590)">
      <rect width="262" height="178" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="18" y="32" fill="#182238" font-size="17" font-weight="700">FixedPosition</text>
      <text x="18" y="62" fill="#475569" font-size="15">Prevents dragging the window</text>
      <text x="18" y="139" fill="#64748b" font-size="14">Does not change its size</text>
    </g>
  </g>
</svg>
